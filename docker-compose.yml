version: "3.9"

services:
  rag-app:
    build: .
    container_name: rag_system_app
    ports:
      - "8501:8501"
    volumes:
      - ./app/data:/app/app/data
      - ./app/chroma_db:/app/app/chroma_db
      - ./.env:/app/.env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
