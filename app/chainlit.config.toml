[UI]
name = "Invoice RAG Assistant"
description = "AI-powered invoice analysis with document retrieval"
show_readme_as_root = true
default_collapse_content = false
default_expand_messages = false
max_message_size = 5242880

[Features]
feedback = "floating"
image_upload = false
file_upload = true
audio_upload = false
human_in_the_loop = false
prompt_management = false

[Auth]
enabled = true
method = "password"

[Theme]
primary_color = "#4F46E5"
secondary_color = "#10B981"
background_color = "#FFFFFF"
text_color = "#1F2937"

[Settings]
timezone = "UTC"
language = "en"
max_file_size = 104857600  # 100MB
max_files = 20